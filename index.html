<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d9f24a'/%3E%3Cpath d='M8 16.5l5.5 5.5L24 11' fill='none' stroke='%23111' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- ホーム画面に追加できるようにする。iOS では通知を使う前提条件でもある。 -->
    <link rel="manifest" href="/todoApp/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/todoApp/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <title>Todo</title>
    <!--
      色は data-theme に紐づくので、この属性が付くまで地色が決まらない。
      React のマウントを待つと、最初の一瞬だけ白地・黒文字で描かれてしまう。
      保存済みの設定を先に読んで、描画前に属性を当てておく。
      壊れた値・古い版のデータでも落ちないよう、全体を try で包む。
    -->
    <script>
      (function () {
        var themes = ['fluoro','latte','washi','midnight','note','mono','glass','botanical','seventies','type']
        var theme = 'fluoro'
        var appearance = 'auto'
        try {
          var saved = JSON.parse(localStorage.getItem('todoApp.store') || '{}').settings || {}
          if (themes.indexOf(saved.theme) !== -1) theme = saved.theme
          if (['auto','light','dark'].indexOf(saved.appearance) !== -1) appearance = saved.appearance
        } catch (e) {}
        var dark =
          appearance === 'dark' ||
          (appearance === 'auto' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.dataset.theme = theme
        root.dataset.appearance = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <script type="module" crossorigin src="/todoApp/assets/index-DIXq_lRp.js"></script>
    <link rel="stylesheet" crossorigin href="/todoApp/assets/index-CZtrbm0U.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
