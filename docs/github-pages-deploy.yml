# main への push で テスト → ビルド → GitHub Pages へデプロイする。
#
# このファイルは .github/workflows/deploy.yml に配置して初めて動く。
# docs/ にあるうちは GitHub からは単なるテキストで、実行されない。
# 移動手順と、あわせて必要な初期設定（デフォルトブランチ / 公開範囲 / Pages の有効化）は
# README の「公開（GitHub Pages）」を参照。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも実行できるようにしておく
  workflow_dispatch:

# GITHUB_TOKEN に Pages へデプロイする権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本に絞る。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
