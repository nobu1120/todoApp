# GitHub Pages 用のデプロイワークフロー。
#
# このファイルは .github/workflows/deploy.yml として配置すると動く。
# ここに置いてあるのは、Claude が使うトークンに workflow スコープがなく
# .github/workflows/ 配下を push できなかったため。手元で下記を実行してほしい:
#
#   mkdir -p .github/workflows
#   cp docs/github-pages-deploy.yml .github/workflows/deploy.yml
#   git add .github/workflows/deploy.yml
#   git commit -m "GitHub Pages へのデプロイワークフローを追加"
#   git push
#
# そのうえで、リポジトリの
#   Settings → Pages → Build and deployment → Source
# を「GitHub Actions」に変更すれば、main への push で自動デプロイされる。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも実行できるようにしておく
  workflow_dispatch:

# GITHUB_TOKEN に Pages へデプロイする権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本に絞る。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
